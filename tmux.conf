# ~/.tmux.conf -- itsnamgyu/setup. Needs tmux 3.0+ (uses %if). Tested 3.2a, 3.4, 3.6a.

# Colors: tmux-256color inside, 24-bit color from the outer terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Keys: let apps that ask for it (Claude Code) tell Shift+Enter from Enter
%if #{>=:#{version},3.2}
set -as terminal-features ",xterm*:RGB,xterm*:extkeys"
set -s extended-keys on
%endif

# Option+Left/Right: rewrite xterm-style Alt+arrow (ESC[1;3D / ESC[1;3C)
# into Meta-b / Meta-f, which bash 3.2, bash 5, zsh and Claude Code all read
# as word back / word forward
bind -n M-Left  send-keys M-b
bind -n M-Right send-keys M-f

# Copy mode (prefix [): vi keys, / to search, Space to select, Enter to copy
set -g mode-keys vi

# Esc: short but nonzero so ESC-prefixed keys are not split over ssh
set -s escape-time 10

set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -s set-clipboard on

# Notifications / images from Claude Code to the outer terminal
%if #{>=:#{version},3.3}
set -g allow-passthrough on
%endif
